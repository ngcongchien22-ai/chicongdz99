<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đang Bảo Trì</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.4 },
                            '50%': { opacity: 0.8 },
                        }
                    },
                    animation: {
                        float: 'float 4s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <style>
        /* Hiệu ứng kính mờ (Glassmorphism) nâng cao */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Glow Elements (Hiệu ứng nền lung linh) -->
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-indigo-600/30 rounded-full blur-3xl animate-pulse-glow pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-fuchsia-600/20 rounded-full blur-3xl animate-pulse-glow pointer-events-none" style="animation-delay: 1.5s;"></div>

    <!-- Main Container -->
    <div class="w-full max-w-md mx-auto z-10">
        <div class="glass-card rounded-3xl p-8 md:p-10 text-center relative overflow-hidden transition-all duration-300">
            
            <!-- Icon Bảo Trì với hiệu ứng lơ lửng -->
            <div class="w-20 h-20 mx-auto mb-6 bg-gradient-to-tr from-indigo-500 to-fuchsia-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30 animate-float">
                <i class="fa-solid fa-gears text-3xl text-white"></i>
            </div>

            <!-- Tiêu đề -->
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight mb-3 text-white">
                Đang Bảo Trì Hệ Thống
            </h1>

            <!-- Nội dung thông báo -->
            <p class="text-slate-300 text-sm md:text-base leading-relaxed mb-8">
                Ứng dụng này đang được bảo trì, vui lòng liên hệ lại để biết thêm thông tin chi tiết hoặc hỗ trợ nhanh chóng.
            </p>

            <!-- Nút liên hệ Telegram với hiệu ứng hover bắt mắt -->
            <div class="space-y-3">
                <a href="https://t.me/leuleucay" target="_blank" rel="noopener noreferrer" 
                   class="group relative inline-flex items-center justify-center w-full px-6 py-3.5 text-sm md:text-base font-semibold text-white bg-gradient-to-r from-sky-500 to-blue-600 rounded-xl overflow-hidden shadow-lg shadow-sky-500/25 transition-all duration-300 hover:shadow-sky-500/40 hover:-translate-y-0.5 active:translate-y-0">
                    <span class="absolute inset-0 w-full h-full bg-white/20 transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></span>
                    <i class="fa-brands fa-telegram text-xl mr-2.5 transition-transform duration-300 group-hover:scale-110"></i>
                    <span>Liên hệ Telegram</span>
                </a>
            </div>

            <!-- Trạng thái hoặc thông tin phụ -->
            <div class="mt-8 pt-6 border-t border-slate-800/80 flex items-center justify-center space-x-2 text-xs text-slate-400">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                <span>Chúng tôi sẽ sớm quay trở lại!</span>
            </div>

        </div>
    </div>

</body>
</html>
