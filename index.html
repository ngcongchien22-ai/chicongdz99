<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang bảo trì hệ thống</title>
    <!-- Sử dụng Google Fonts để giao diện đẹp hơn -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome để lấy icon Telegram -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Chặn bôi đen / chọn văn bản */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .maintenance-container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 480px;
            width: 100%;
        }

        .icon-box {
            font-size: 60px;
            color: #38bdf8;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #0088cc;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }

        .telegram-btn:hover {
            background-color: #0077b5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
        }

        .telegram-btn i {
            font-size: 18px;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- Icon bánh răng bảo trì -->
        <div class="icon-box">
            <i class="fa-solid fa-gears"></i>
        </div>
        
        <h1>Hệ Thống Đang Bảo Trì</h1>
        <p>Chúng tôi đang nâng cấp hệ thống để mang lại trải nghiệm tốt hơn. Vui lòng quay lại sau ít phút nữa nhé!</p>
        
        <!-- Button Telegram Admin -->
        <a href="https://t.me/leuleucay" target="_blank" class="telegram-btn">
            <i class="fa-brands fa-telegram"></i> Liên hệ Admin (Telegram)
        </a>

        <div class="footer-note">
            &copy; 2026 - All rights reserved.
        </div>
    </div>

    <!-- Script chặn F12 và DevTools -->
    <script>
        // 1. Chặn click chuột phải
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 2. Chặn các phím tắt mở DevTools và xem nguồn trang
        document.addEventListener('keydown', function(e) {
            // Chặn F12
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Chặn Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
            // Chặn Ctrl+U (Xem nguồn trang)
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
                return false;
            }
            // Chặn Ctrl+S (Lưu trang)
            if (e.ctrlKey && e.keyCode === 83) {
                e.preventDefault();
                return false;
            }
        });

        // 3. Phát hiện khi DevTools được mở bằng cách đo kích thước cửa sổ / debugger trap
        setInterval(function() {
            const threshold = 160;
            if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
                document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:20vh;'>Truy cập bị từ chối! Vui lòng đóng công cụ lập trình (DevTools).</h1>";
            }
        }, 1000);
    </script>

</body>
</html>
