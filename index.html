<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang bảo trì hệ thống</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .maintenance-container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 480px;
            width: 100%;
        }
        .icon-box {
            font-size: 60px;
            color: #38bdf8;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 12px; color: #ffffff; }
        p { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #0088cc;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }
        .telegram-btn:hover {
            background-color: #0077b5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
        }
        .footer-note { margin-top: 25px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <div class="icon-box">
            <i class="fa-solid fa-gears"></i>
        </div>
        <h1>Hệ Thống Đang Bảo Trì</h1>
        <p>Chúng tôi đang nâng cấp hệ thống để mang lại trải nghiệm tốt hơn. Vui lòng quay lại sau ít phút nữa nhé!</p>
        
        <a href="https://t.me/leuleucay" target="_blank" class="telegram-btn">
            <link itemprop="url" href="https://t.me/leuleucay">
            <i class="fa-brands fa-telegram"></i> Liên hệ Admin (Telegram)
        </a>

        <div class="footer-note">
            &copy; 2026 - All rights reserved.
        </div>
    </div>
